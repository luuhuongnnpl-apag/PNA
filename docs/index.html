<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Hệ thống cố vấn học tập | PNA</title>
  <link rel="stylesheet" href="assets/portal.css?v=015">
  <script type="module" src="assets/portal.js?v=015"></script>
  <script type="module" src="assets/auth.js?v=015"></script>
</head>
<body>
  <header class="top">
    <div class="frame top-inner">
      <a class="brand" href="#home" aria-label="PNA — Trang chủ">PNA</a>
      <div class="account">
        <button id="adminButton" type="button" hidden>Quản trị</button>
        <button id="authLogin" type="button" disabled>Đăng nhập</button>
        <button id="authLogout" type="button" hidden>Đăng xuất</button>
      </div>
      <span id="authIdentity" hidden></span>
      <span id="authStatus" class="sr-only" role="status"></span>
    </div>
  </header>
  <div class="hero">
    <div class="frame">
      <h1>Hệ thống cố vấn học tập</h1>
      <p>Cung cấp hệ thống tài liệu và tư vấn chuyên môn, rèn luyện</p>
    </div>
  </div>
  <main class="frame layout">
    <nav id="navigation" aria-label="Danh mục"></nav>
    <div class="workspace">
      <section id="content" aria-labelledby="pageTitle"></section>
      <section id="admin" class="card" hidden>
        <h2 id="adminTitle" tabindex="-1">Quản trị</h2>
        <div id="adminContent"></div>
        <details class="admin-section">
          <summary>Bản nháp danh mục</summary>
          <p class="muted">Lưu hoặc tải lại bản nháp riêng của quản trị viên trên Firebase.</p>
          <div class="actions">
            <button id="builderCloudSave" type="button" hidden>Lưu bản nháp Firebase</button>
            <button id="builderCloudLoad" type="button" class="secondary" hidden>Tải bản nháp Firebase</button>
          </div>
          <p id="builderStatus" role="status"></p>
        </details>
        <details class="admin-section">
          <summary>Tài khoản và phân quyền</summary>
          <p id="accessInfo"></p>
          <div id="adminGrantPanel" hidden>
            <form id="grantForm" class="form-grid">
              <label>Email Google<input id="grantEmail" type="email" required maxlength="254"></label>
              <label>Vai trò<select id="grantRole"><option value="advisor">Cố vấn học tập</option><option value="student">Sinh viên</option></select></label>
              <label>Mã lớp hành chính<input id="grantClasses" maxlength="2000" placeholder="L26A, L26B"></label>
              <label>Mã lớp học phần<input id="grantCourses" maxlength="2000" placeholder="HP-2026-01"></label>
              <label>Ngày hết hiệu lực<input id="grantExpiry" type="date"></label>
              <div class="actions span"><button type="submit">Lưu cấp quyền</button><button id="grantReload" type="button" class="secondary">Tải lại danh sách</button></div>
            </form>
            <p id="grantStatus" role="status"></p>
            <div id="grantList"></div>
          </div>
        </details>
      </section>
      <p id="feedback" class="feedback" role="status" hidden></p>
    </div>
  </main>
  <footer>Hệ thống cố vấn học tập · Công cụ hỗ trợ học tập và rèn luyện</footer>
</body>
</html>
